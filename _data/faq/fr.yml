# FAQ du PUC Ultimate (français)
# Pour modifier une réponse : éditer le texte sous « a: | » (format Markdown).
# Pour ajouter une question : copier un bloc « - id / q / a » dans la bonne catégorie.
# « id » sert de lien direct (ex. /fr/faq#inscription) : lettres minuscules, chiffres et tirets uniquement.
# « top: true » affiche la question dans les raccourcis « Questions populaires ».


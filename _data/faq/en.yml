# PUC Ultimate FAQ (English)
# To edit an answer: change the text under "a: |" (Markdown format).
# To add a question: copy a "- id / q / a" block into the right category.
# "id" is used for direct links (e.g. /en/faq#registration): lowercase letters, digits and hyphens only.
# "top: true" shows the question in the "Popular questions" shortcuts.
# Keep the same ids as the French file so links work in both languages.


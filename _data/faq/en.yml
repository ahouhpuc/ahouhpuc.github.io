categories:
  - id: bureau
    icon: "👥"
    title: Board and club governance
    questions:
      - id: membres-bureau
        q: Who is on the board?
        a: |
          | Role | Member(s) |
          |---|---|
          | President | Léa Guelaud |
          | Treasurers | Selma Kindo, Bruno Fontaine, Mouad Berrehal |
          | Secretary and registrations manager | Cédric Welty |
          | Communication | Marien Aparicio, Awa Dakono, Elsa Boileau |
          | Jerseys and equipment | Nathan Cohen |
          | Sports committee | Cédric Welty |
